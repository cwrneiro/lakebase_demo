name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --dev

      - name: Install frontend deps
        working-directory: app/frontend
        run: npm ci

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Validate bundle YAML syntax
        run: |
          uv run python -c "import yaml; yaml.safe_load(open('databricks.yml'))"
          for f in resources/*.yml; do
            uv run python -c "import yaml; yaml.safe_load(open('$f'))"
          done

      - name: Backend import check
        run: uv run python -c "from app.server.routes import admin, actions, explain, user_detail, users; print('OK')"

      - name: Ruff
        run: uv run ruff check .

      - name: Frontend type-check
        working-directory: app/frontend
        run: npx tsc --noEmit

      - name: Frontend build
        working-directory: app/frontend
        run: npm run build
